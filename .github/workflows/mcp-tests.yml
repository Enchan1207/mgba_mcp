name: MCP server tests

on:
  pull_request:
    paths:
      - 'mgba_mcp/**'
      - '.github/workflows/mcp-tests.yml'
  push:
    branches: [main]
    paths:
      - 'mgba_mcp/**'
      - '.github/workflows/mcp-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mgba_mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mgba_mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
