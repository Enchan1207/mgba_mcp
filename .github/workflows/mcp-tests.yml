name: MCP server tests

on:
  pull_request:
    paths:
      - 'mgba_mcp/**'
      - '.github/workflows/mcp-tests.yml'
  push:
    branches: [main]
    paths:
      - 'mgba_mcp/**'
      - '.github/workflows/mcp-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mgba_mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mgba_mcp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
