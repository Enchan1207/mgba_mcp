name: Client tests

on:
  pull_request:
    paths:
      - 'mgba_client/**'
      - '.github/workflows/client-tests.yml'
  push:
    branches: [main]
    paths:
      - 'mgba_client/**'
      - '.github/workflows/client-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test client
        run: swift test --package-path mgba_client
