name: Server tests

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
        working-directory: .
      - name: Configure tests
        run: cmake --preset target -Dmgba_server_BUILD_TESTS=ON
      - name: Build
        run: cmake --build --preset target
      - name: Test server
        run: ctest --test-dir build/target --output-on-failure
